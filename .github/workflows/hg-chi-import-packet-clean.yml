name: Import HG CHI packet clean

on:
  push:
    branches:
      - "sub/chi-bench/2026-10-06-hg-gpt54mini-full75-r37043550087-v2"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKET_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cf18-820e-9d49-37847d5294fc/raw?se=2026-10-06T23%3A25%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=b17dc9ca-b6b1-5ced-80c7-7ac7769e6566&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T12%3A28%3A22Z&ske=2026-10-07T12%3A28%3A22Z&sks=b&skv=2026-02-06&sig=zRj4ad8cXYCWu3nQCXX2WYqPYJ1%2B0IRAoRfKGIdtQFA%3D"
      PACKET_DIR: "2026-10-06-hg-gpt54mini-full75-37043550087"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated packet artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$PACKET_URL" -o /tmp/hg-chi-packet.zip
          unzip -q /tmp/hg-chi-packet.zip -d /tmp/hg-packet
          test -d "/tmp/hg-packet/packet/$PACKET_DIR"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/hg-packet/packet-validation.json'))
          assert d['status']=='valid', d
          assert not d['errors'], d
          print("source_packet_validator=valid")
          PY

      - name: Install validator dependencies
        run: python -m pip install --quiet jsonschema zstandard

      - name: Copy packet and validate against current upstream tree
        shell: bash
        run: |
          set -euo pipefail
          dest="benchmarks/chi-bench/submissions/$PACKET_DIR"
          test ! -e "$dest"
          cp -a "/tmp/hg-packet/packet/$PACKET_DIR" "$dest"
          python .github/scripts/validate_submission.py "$dest" --repo-root . --report-md /tmp/validation.md --report-json /tmp/validation.json
          cat /tmp/validation.md
          cat /tmp/validation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/validation.json'))
          assert not d['errors'], d
          assert d['status'] in ('valid','needs-review'), d
          PY

      - name: Commit submission-only final branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hg-chi-import-packet-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "benchmarks/chi-bench/submissions/$PACKET_DIR" .github/workflows/hg-chi-import-packet-clean.yml
          git commit -m "chi-bench: HG · hg-closure-codex · openai/gpt-5.4-mini"
          git push origin HEAD:"$GITHUB_REF_NAME"
