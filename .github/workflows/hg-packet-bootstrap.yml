name: HG packet bootstrap

on:
  push:
    branches:
      - "sub/chi-bench/2026-10-06-hg-gpt54mini-full75-37043550087"
    paths:
      - ".github/workflows/hg-packet-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sub/chi-bench/2026-10-06-hg-gpt54mini-full75-37043550087
          fetch-depth: 0

      - name: Download validated packet artifact
        shell: bash
        env:
          PACKET_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-d8ac-820e-b59b-8c4e88601eb8/raw?se=2026-10-06T23%3A22%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=4eee163a-389e-505f-bb9e-4594a52ae950&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A56%3A16Z&ske=2026-10-07T01%3A56%3A16Z&sks=b&skv=2026-02-06&sig=MRaPz2p5xXwBmV%2BV4syHiKosuTiMu5LXCdKp6QkeSEs%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$PACKET_URL" -o /tmp/packet.zip
          unzip -q /tmp/packet.zip -d /tmp/packet-artifact
          src="/tmp/packet-artifact/packet/2026-10-06-hg-gpt54mini-full75-37043550087"
          test -d "$src"
          mkdir -p benchmarks/chi-bench/submissions
          cp -a "$src" benchmarks/chi-bench/submissions/

      - name: Validate packet in fork
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema zstandard
          python scripts/validate.py benchmarks/chi-bench/submissions/2026-10-06-hg-gpt54mini-full75-37043550087

      - name: Finalize submission-only branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hg-packet-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only
          extras="$(git diff --cached --name-status | awk '$2 !~ /^benchmarks\/chi-bench\/submissions\/2026-10-06-hg-gpt54mini-full75-37043550087\// && !($1=="D" && $2==".github/workflows/hg-packet-bootstrap.yml") {print}')"
          test -z "$extras" || { echo "Unexpected staged paths:"; printf '%s\n' "$extras"; exit 1; }
          git commit -m "chi-bench: HG · hg-closure-codex · openai/gpt-5.4-mini [skip ci]"
          git push origin HEAD
